name: NZWallet
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
targets:
  NZWallet:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - TEST FILES CHANGE FOR DEPLOYMENT
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nzdemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NZ Services
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMotionUsageDescription: Use device tilt to change the licence watermark colours.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your wallet and confirm sharing.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan verification QR codes.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Share your licence with a checker's phone nearby, without internet.
    info:
      path: Config/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIDesignRequiresCompatibility: true
        UIAppFonts:
          - PublicSans-Regular.ttf
          - PublicSans-Medium.ttf
          - PublicSans-SemiBold.ttf
          - PublicSans-Bold.ttf
          - PublicSans-ExtraBold.ttf
          - PublicSans-Black.ttf
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic

schemes:
  NZWallet:
    build:
      targets:
        NZWallet: all
    run:
      config: Debug
